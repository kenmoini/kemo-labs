x-podman:
  in_pod: false

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.12.3
    container_name: homepage
    restart: unless-stopped
    user: "1000:1000"
    # group_add:
    #   - 0
    environment:
      # - HOMEPAGE_ALLOWED_HOSTS=dashboard.apps.lab.kemo.dev,192.168.42.14:3000,localhost,127.0.0.1:3000
      - HOMEPAGE_ALLOWED_HOSTS=*
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
      - OTEL_SERVICE_NAME=homepage
    volumes:
      - ./config/:/app/config
      - ./assets/:/app/public/assets
      # - /var/run/podman/podman.sock:/var/run/docker.sock:ro
      - /opt/workdir/caas/homepage/logs:/data/logs:Z
    networks:
      traefik:
      podman-proxy:
      # bridge42:
      #   ipv4_address: 192.168.42.14
    expose:
      - 3000
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.homepage.rule=Host(`dashboard.apps.lab.kemo.dev`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.routers.homepage.tls=true"
      - "traefik.http.routers.homepage.tls.certresolver=stepca"
      - "traefik.http.routers.homepage.service=homepage"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
      - "traefik.http.services.homepage.loadbalancer.healthcheck.path=/api/healthcheck"
      # - "traefik.http.routers.homepage.middlewares=authentik-auth@file"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/api/healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  # bridge42:
  #   external: true
  traefik:
    external: true
    name: traefik
  podman-proxy:
    external: true
    name: podman-proxy