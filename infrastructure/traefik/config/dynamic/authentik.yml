http:
  middlewares:
    authentik-auth:
      forwardAuth:
        address: "https://auth.apps.lab.kemo.dev/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        maxResponseBodySize: 4194304
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-email
          - X-authentik-name
          - X-authentik-groups
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version

tcp:
  routers:
    ldap:
      entryPoints:
        - "ldap"
      rule: "HostSNI(`*`)" # Must be a wildcard for unencrypted TCP
      service: "ldap-backend"
    ldaps:
      entryPoints:
        - "ldaps"
      rule: "HostSNI(`*`)" # Must be a wildcard for unencrypted TCP
      service: "ldaps-backend"
  services:
    ldap-backend:
      loadBalancer:
        servers:
          - address: "192.168.42.101:3389" # Internal server IP and port
    ldaps-backend:
      loadBalancer:
        servers:
          - address: "192.168.42.101:6636" # Internal server IP and port
