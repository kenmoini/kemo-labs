---
services:
  server:
    image: ghcr.io/goauthentik/server@sha256:feb81e02f7af70469c87c8a4fbfdb148647ae7a3ee5f79f8b08b7ee02b98c4c9
    container_name: authentik-server
    restart: unless-stopped
    command: server
    shm_size: 1g
    env_file:
      - .env
    cap_add:
      - NET_BIND_SERVICE
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=389
    networks:
      # authentik:
      traefik-proxy:
      bridge42:
        ipv4_address: 192.168.42.8
    expose:
      - 389
      - 636
    labels:
      - "homepage.group=Identity & Secrets"
      - "homepage.name=Authentik"
      - "homepage.icon=authentik.png"
      - "homepage.description=Identity Management"
      - "homepage.href=https://auth.apps.lab.kemo.dev"
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.authentik.rule=Host(`auth.apps.lab.kemo.dev`)"
      - "traefik.http.routers.authentik.tls=true"
      - "traefik.http.routers.authentik.tls.certresolver=stepca"
      - "traefik.http.routers.authentik.service=authentik"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
      # Metrics
      - "traefik.http.routers.authentik-metrics.rule=Host(`auth-metrics.apps.lab.kemo.dev`)"
      - "traefik.http.routers.authentik-metrics.tls=true"
      - "traefik.http.routers.authentik-metrics.tls.certresolver=stepca"
      - "traefik.http.routers.authentik-metrics.service=authentik-metrics"
      - "traefik.http.services.authentik-metrics.loadbalancer.server.port=9300"
      # Forward auth middleware for protecting other services
      # Stored in Traefik dynamic configuration and applied on a per-service basis
      #- "traefik.http.middlewares.authentik.forwardauth.address=http://192.168.42.8:9000/outpost.goauthentik.io/auth/traefik"
      #- "traefik.http.middlewares.authentik.forwardauth.address=https://auth.apps.lab.kemo.dev/outpost.goauthentik.io/auth/traefik"
      #- "traefik.http.middlewares.authentik.forwardauth.trustForwardHeader=true"
      #- "traefik.http.middlewares.authentik.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version"
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - /opt/workdir/caas/authentik/data:/data:Z
      - ./templates:/templates

  worker:
    image: ghcr.io/goauthentik/server@sha256:feb81e02f7af70469c87c8a4fbfdb148647ae7a3ee5f79f8b08b7ee02b98c4c9
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    shm_size: 1g
    user: root # needed for docker socket access
    env_file:
      - .env
    volumes:
      - /opt/workdir/caas/authentik/data:/data:Z
      - /var/run/docker.sock:/var/run/docker.sock
      - ./templates:/templates
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  # authentik:
  bridge42:
    external: true
  traefik-proxy:
    external: true
    name: traefik-proxy