services:
  nginx-files:
    image: nginx:1.27-alpine
    container_name: nginx-files
    restart: unless-stopped
    volumes:
      - /opt/workdir/caas/dropbox/data:/srv/files:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.files.rule=Host(`dropbox.apps.lab.kemo.dev`)"
      - "traefik.http.routers.files.entrypoints=websecure"
      - "traefik.http.routers.files.tls=true"
      - "traefik.http.routers.files.tls.certresolver=stepca"
      - "traefik.http.services.files.loadbalancer.server.port=8080"
      - "homepage.group=Services"
      - "homepage.name=Dropbox"
      - "homepage.icon=nginx.png"
      - "homepage.description=Dropbox File Download"
      - "homepage.href=https://dropbox.apps.lab.kemo.dev"
    networks:
      bridge42:
        ipv4_address: 192.168.42.23
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

  copyparty:
    image: ghcr.io/9001/copyparty-dj:1.20.14
    container_name: copyparty
    restart: unless-stopped
    command: >
      --i 0.0.0.0 -p 3923
      -a admin:${COPYPARTY_PASSWORD}:rwmd:/srv/files
      --urlbase /
    env_file:
      - .env
    volumes:
      - /opt/workdir/caas/dropbox/data:/srv/files
      - /opt/workdir/caas/dropbox/copyparty-db:/var/lib/copyparty
    # user: "1000:1000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.upload.rule=Host(`upload.apps.lab.kemo.dev`)"
      - "traefik.http.routers.upload.entrypoints=websecure"
      - "traefik.http.routers.upload.tls=true"
      - "traefik.http.routers.upload.tls.certresolver=stepca"
      - "traefik.http.services.upload.loadbalancer.server.port=3923"
      # Allow large uploads
      - "traefik.http.middlewares.upload-size.buffering.maxRequestBodyBytes=10737418240"
      - "traefik.http.routers.upload.middlewares=upload-size"
      - "homepage.group=Services"
      - "homepage.name=Copyparty"
      - "homepage.icon=copyparty.png"
      - "homepage.description=Copyparty File Manager"
      - "homepage.href=https://upload.apps.lab.kemo.dev"
    networks:
      bridge42:
        ipv4_address: 192.168.42.24

networks:
  bridge42:
    external: true
