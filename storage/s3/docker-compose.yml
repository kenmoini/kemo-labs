x-podman:
  in_pod: false

services:
  rustfs:
    image: docker.io/rustfs/rustfs:latest
    container_name: rustfs
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env
    volumes:
      - /opt/workdir/caas/rustfs/data:/data:Z
      - cargo_registry:/usr/local/cargo/registry:Z
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      # S3 API
      - "traefik.http.routers.s3-api.rule=Host(`s3.apps.lab.kemo.dev`)"
      - "traefik.http.routers.s3-api.entrypoints=websecure"
      - "traefik.http.routers.s3-api.tls=true"
      - "traefik.http.routers.s3-api.tls.certresolver=stepca"
      - "traefik.http.routers.s3-api.service=s3-api"
      - "traefik.http.services.s3-api.loadbalancer.server.port=9000"
      # Console UI
      - "traefik.http.routers.s3-console.rule=Host(`s3-console.apps.lab.kemo.dev`)"
      - "traefik.http.routers.s3-console.entrypoints=websecure"
      - "traefik.http.routers.s3-console.tls=true"
      - "traefik.http.routers.s3-console.tls.certresolver=stepca"
      - "traefik.http.routers.s3-console.service=s3-console"
      - "traefik.http.services.s3-console.loadbalancer.server.port=9001"
      - "homepage.group=Services"
      - "homepage.name=RustFS"
      - "homepage.icon=rustfs.png"
      - "homepage.description=RustFS S3-compatible storage server"
      - "homepage.href=http://s3-console.apps.lab.kemo.dev"
    networks:
      traefik:
      # bridge42:
      #   ipv4_address: 192.168.42.20
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test:
        [
          "CMD",
          "sh", "-c",
          "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  # bridge42:
  #   external: true
  traefik:
    external: true
    name: traefik

volumes:
  cargo_registry: {}