x-podman:
  in_pod: false

services:
  podman_proxy:
    image: docker.io/tecnativa/docker-socket-proxy
    container_name: podman-proxy
    volumes:
      - /var/run/podman/podman.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:2375/_ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      OTEL_SERVICE_NAME: podman-proxy
      LOG_LEVEL: warning
      ### Granted by Default
      EVENTS: 1
      PING: 1
      VERSION: 1
      ### Security critical
      AUTH: 0
      SECRETS: 0
      EXEC: 0
      POST: 0 # Makes everything read only
      PLUGINS: 0
      ALLOW_START: 0
      ALLOW_STOP: 0
      ALLOW_PAUSE: 0
      ALLOW_UNPAUSE: 0
      ALLOW_RESTART: 0
      ### Not Needed
      SWARM: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      TASKS: 0
      ### General
      CONTAINERS: 1
      SERVICES: 1
      DISTRIBUTION: 1
      STATS: 1
      GRPC: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      NODES: 1
      VOLUMES: 1
      SESSION: 1
      SYSTEM: 1
    restart: unless-stopped
    networks:
      - podman-proxy
    security_opt:
      - no-new-privileges:true
    group_add:
      - 0 # Podman rooted groupid on the host system if it's different
    ports:
      - "2375:2375"  # Expose the Docker API over TCP (optional, be cautious)
    labels:
      - "homepage.group=Utilities"
      - "homepage.name=Docker/Podman Proxy"
      - "homepage.icon=tsd-proxy.png"
      - "homepage.description=Docker/Podman Socket Proxy"

networks:
  podman-proxy:
    name: podman-proxy
    attachable: true
    enable_ipv4: true
    enable_ipv6: false
    internal: true
  # traefik:
  #   external: true
  #   name: traefik